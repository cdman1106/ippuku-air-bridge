plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.ippuku.airbridge'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile rootProject.file('ci/ippuku-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'jp.ippuku.airbridge'
        minSdk 28
        targetSdk 35
        versionCode 101
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
